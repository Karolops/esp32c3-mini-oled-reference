<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">
  <rect width="760" height="360" rx="12" fill="#161b22"/>

  <!-- ===== Board, front face. Proportions traced from a photo of the board;
       coordinates inside this group are photo pixels. ===== -->
  <g transform="translate(24,22) scale(1.8) translate(-37,-19)">
    <!-- PCB -->
    <rect x="37" y="19" width="123" height="149" rx="7" fill="#6b2d8f" stroke="#8f55b8" stroke-width="1"/>

    <!-- pin pads -->
    <g fill="#f3e6c4" stroke="#cdb87a" stroke-width="0.8">
      <circle cx="45" cy="47" r="5"/><circle cx="45" cy="63" r="5"/><circle cx="45" cy="79" r="5"/><circle cx="45" cy="94" r="5"/>
      <circle cx="45" cy="109" r="5"/><circle cx="45" cy="125" r="5"/><circle cx="45" cy="140" r="5"/>
      <rect x="40" y="150" width="10" height="10" rx="1"/>
      <circle cx="153" cy="47" r="5"/><circle cx="153" cy="63" r="5"/><circle cx="153" cy="79" r="5"/><circle cx="153" cy="94" r="5"/>
      <circle cx="153" cy="109" r="5"/><circle cx="153" cy="125" r="5"/><circle cx="153" cy="140" r="5"/>
      <rect x="148" y="150" width="10" height="10" rx="1"/>
    </g>
    <!-- pin labels as printed on the board -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="bold" fill="#f4eefb">
      <text x="53" y="49">3</text><text x="53" y="65">4</text><text x="53" y="81">5</text><text x="53" y="96">6</text>
      <text x="53" y="111">7</text><text x="53" y="127">8</text><text x="53" y="142">9</text><text x="52.5" y="157">10</text>
      <g text-anchor="end">
        <text x="145.5" y="49">0</text><text x="145.5" y="65">1</text><text x="145.5" y="81">2</text></g>
      <g text-anchor="middle">
        <text transform="translate(145.5,94) rotate(-90)">TX</text><text transform="translate(145.5,109) rotate(-90)">RX</text>
        <text transform="translate(145.5,125) rotate(-90)">3V3</text><text transform="translate(145.5,140) rotate(-90)">GND</text>
        <text transform="translate(145.5,155) rotate(-90)">5V</text>
      </g>
    </g>

    <!-- buttons -->
    <g>
      <rect x="47" y="20" width="26" height="18" rx="1.5" fill="#c9cdd2" stroke="#8b9199" stroke-width="0.6"/>
      <circle cx="60" cy="29" r="5.5" fill="#6b7178"/>
      <rect x="124" y="20" width="26" height="18" rx="1.5" fill="#c9cdd2" stroke="#8b9199" stroke-width="0.6"/>
      <circle cx="137" cy="29" r="5.5" fill="#6b7178"/>
    </g>
    <!-- LED between the buttons -->
    <rect x="88" y="22" width="22" height="11" rx="1" fill="#d5d8dc"/>
    <rect x="92" y="22" width="14" height="11" fill="#d93a3a"/>
    <rect x="96" y="26" width="6" height="3" fill="#f6c9c9"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="bold" fill="#f4eefb" text-anchor="middle">
      <text transform="translate(78.6,29) rotate(-90)">RST</text>
      <text transform="translate(122,29) rotate(-90)">BOOT</text>
    </g>

    <!-- OLED: glass, flex tail, lit 72x40 area -->
    <rect x="84" y="120" width="31" height="8" rx="1" fill="#17130f"/>
    <rect x="62" y="58" width="74" height="66" rx="1" fill="#0b0e13" stroke="#d9dde2" stroke-width="0.6"/>
    <rect x="64" y="61" width="70" height="38.9" fill="#000"/>
    <g transform="translate(64,61) scale(0.9722)" fill="#e6f1ff" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">
      <text x="0" y="7" font-size="10" textLength="23" lengthAdjust="spacingAndGlyphs">TEST</text>
      <text x="48" y="7" font-size="10" textLength="23" lengthAdjust="spacingAndGlyphs">unit</text>
      <text x="0" y="33" font-size="30" textLength="69" lengthAdjust="spacingAndGlyphs">1234</text>
    </g>

    <!-- status LEDs beside the USB connector -->
    <rect x="60.500" y="149" width="7" height="13" rx="0.8" fill="#d5d8dc"/>
    <rect x="60.500" y="152" width="7" height="7" fill="#8fd9c8"/>
    <rect x="129.500" y="149" width="7" height="13" rx="0.8" fill="#d5d8dc"/>
    <rect x="129.500" y="152" width="7" height="7" fill="#8fd9c8"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="bold" fill="#f4eefb">
      <text transform="translate(66,147) rotate(-90)">PWR</text>
      <text transform="translate(135,147) rotate(-90)">IO8</text>
    </g>

    <!-- USB-C connector, overhanging the bottom edge -->
    <g fill="#9aa0a6">
      <rect x="78" y="129" width="43" height="7"/>
    </g>
    <g stroke="#6b2d8f" stroke-width="0.9">
      <path d="M81.5 129v7M85 129v7M88.5 129v7M92 129v7M95.500 129v7M99 129v7M102.500 129v7M106 129v7M109.500 129v7M113 129v7M116.500 129v7"/>
    </g>
    <rect x="72" y="135" width="55" height="47" rx="5" fill="#c9cdd2" stroke="#8b9199" stroke-width="0.7"/>
    <rect x="80" y="147" width="12" height="6" rx="3" fill="#eceef1" stroke="#a3a9b0" stroke-width="0.5"/>
    <rect x="107" y="147" width="12" height="6" rx="3" fill="#eceef1" stroke="#a3a9b0" stroke-width="0.5"/>
    <path d="M75 176.500h49" stroke="#a3a9b0" stroke-width="0.7"/>
  </g>
  <text x="136.5" y="340" font-size="12" fill="#9aa4b2" text-anchor="middle">USB-C</text>

  <!-- ===== Buffer diagram, scale 3 ===== -->
  <text x="330" y="38" font-size="14" fill="#c9d1d9">SSD1306 frame buffer 128 x 64</text>
  <text x="330" y="54" font-size="11" fill="#9aa4b2">(0,0)</text>
  <rect x="330" y="60" width="384" height="192" fill="#0d1117" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- visible window at (28,24), 72x40 -->
  <rect x="414" y="132" width="216" height="120" fill="#000" stroke="#58a6ff" stroke-width="2"/>
  <g fill="#e6f1ff">
    <text x="414" y="153" font-size="30" textLength="69" lengthAdjust="spacingAndGlyphs">TEST</text>
    <text x="558" y="153" font-size="30" textLength="69" lengthAdjust="spacingAndGlyphs">unit</text>
    <text x="414" y="231" font-size="90" textLength="207" lengthAdjust="spacingAndGlyphs">1234</text>
  </g>
  <!-- offset arrows -->
  <g stroke="#f0883e" stroke-width="1.5" fill="none">
    <line x1="330" y1="192" x2="414" y2="192"/>
    <path d="M336 188 L330 192 L336 196 M408 188 L414 192 L408 196"/>
    <line x1="522" y1="60" x2="522" y2="132"/>
    <path d="M518 66 L522 60 L526 66 M518 126 L522 132 L526 126"/>
  </g>
  <text x="372" y="185" font-size="13" fill="#f0883e" text-anchor="middle">x +28</text>
  <text x="530" y="101" font-size="13" fill="#f0883e">y +24</text>

  <text x="522" y="276" font-size="14" fill="#58a6ff" text-anchor="middle">visible area 72 x 40</text>
  <text x="522" y="306" font-size="12" fill="#9aa4b2" text-anchor="middle">I2C: SDA = GPIO5, SCL = GPIO6, address 0x3C</text>
  <text x="522" y="336" font-size="11" fill="#6e7681" text-anchor="middle">simplified drawing, not to scale</text>
</svg>
