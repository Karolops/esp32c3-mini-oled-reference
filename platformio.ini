; ESP32-C3 mini with built-in 0.42" OLED (SSD1306 controller, 72x40 visible)
[env:esp32-c3-mini-oled]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The USB-C port is the C3's built-in USB-serial: route Serial there.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
